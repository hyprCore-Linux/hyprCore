# hyprCore install profile: Desktop (Hyprland) or Server (console + SSH).
# Writes GlobalStorage key packagechooser_hyprcore-profile = "desktop" | "server".
# Live ISO is slim; Calamares apt-installs server (+ desktop on Desktop profile).
---
mode: required
method: legacy

default: desktop

labels:
  step: "Install type"

items:
  - id: desktop
    name: "Desktop"
    description: "Hyprland workstation — server base plus the full desktop stack. Needs network during install."
    # Absolute path so QPixmap always resolves (relative paths depend on branding cwd).
    screenshot: "/etc/calamares/branding/hyprcore/profile-desktop.png"
    packages: []
  - id: server
    name: "Server"
    description: "Console and SSH only — server stack, live desktop removed. Needs network during install."
    screenshot: "/etc/calamares/branding/hyprcore/profile-server.png"
    packages: []
