# Configuration file for Calamares
# Syntax is YAML 1.2
# Derived from calamares-settings-debian; branding points at hyprCore overlay.
---

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: hyprcore-profile
  module: packagechooser
  config: packagechooser_hyprcore_profile.conf
- id: hyprcore-strip-desktop
  module: shellprocess
  config: shellprocess_hyprcore_strip_desktop.conf
- id: hyprcore-server-packages
  module: shellprocess
  config: shellprocess_hyprcore_server_packages.conf
- id: hyprcore-desktop-hooks
  module: contextualprocess
  config: contextualprocess_hyprcore_desktop.conf
- id: hyprcore-server-profile
  module: contextualprocess
  config: contextualprocess_hyprcore_server.conf
- id: hyprcore-sshprep
  module: shellprocess
  config: shellprocess_hyprcore_sshprep.conf
- id: hyprcore-network
  module: shellprocess
  config: shellprocess_hyprcore_network.conf
- id: hyprcore-apt-sources
  module: shellprocess
  config: shellprocess_hyprcore_apt_sources.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - packagechooser@hyprcore-profile
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - shellprocess@hyprcore-network
  - hwclock
  - services-systemd
  - bootloader-config
  - sources-final
  - sources-media-unmount
  - shellprocess@hyprcore-apt-sources
  - shellprocess@hyprcore-strip-desktop
  - shellprocess@hyprcore-server-packages
  - packages
  - contextualprocess@hyprcore-desktop-hooks
  - displaymanager
  - contextualprocess@hyprcore-server-profile
  - shellprocess@hyprcore-sshprep
  - services-systemd
  - grubcfg
  - bootloader
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - umount
- show:
  - finished

branding: hyprcore

prompt-install: false
dont-chroot: false
