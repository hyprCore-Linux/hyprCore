# Used when xfce4-power-manager is not running (greeter, no session).
# In a session, xfpm handles the lid itself: lid-action-on-ac and
# lid-action-on-battery. Docked=suspend so an external monitor does not
# turn a closed lid into "do nothing".
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
