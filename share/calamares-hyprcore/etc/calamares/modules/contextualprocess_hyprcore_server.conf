# Console + SSH when Server profile was chosen (purges slim-live GUI).
---
dontChroot: false
timeout: 1800

"packagechooser_hyprcore-profile":
  server:
    - command: "/usr/local/sbin/hyprcore-apply-server-profile.sh"
  desktop:
    - command: "bash -c 'echo \"[hyprcore] Desktop profile — skipping server console setup\"'"
