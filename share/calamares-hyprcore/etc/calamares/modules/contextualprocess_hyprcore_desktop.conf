# Install desktop stack + Hyprland/Chrome when Desktop profile was chosen.
# Cursor is not stock — personalize/install/*.sh may add it via merge.
# Do not embed ${var} in inline bash — Calamares treats those as GlobalStorage keys.
---
dontChroot: false
timeout: 3600

"packagechooser_hyprcore-profile":
  desktop:
    - command: "/usr/local/sbin/hyprcore-apply-desktop-profile.sh"
    - command: "/usr/local/sbin/hyprcore-install-hyprland-backports.sh"
    - command: "/usr/share/hyprcore/install-google-chrome.sh"
  server:
    - command: "bash -c 'echo \"[hyprcore] Server profile — skipping desktop install\"'"
