---
# LightDM — live ISO: autologin user=live (50-hyprcore-live-autologin; removed on install).
# Installed disk: autologin-session=hyprcore-hyprland (98-hyprcore-autologin.conf).

displaymanagers:
  - lightdm

defaultDesktopEnvironment:
    executable: "/usr/share/hyprcore/hyprcore-hyprland-session.sh"
    desktopFile: "hyprcore-hyprland"

basicSetup: false
sysconfigSetup: false

lightdm:
  preferred_greeters: ["lightdm-gtk-greeter.desktop", "lightdm-greeter.desktop", "slick-greeter.desktop"]
