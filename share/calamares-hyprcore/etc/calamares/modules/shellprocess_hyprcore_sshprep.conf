---
# Live images may ship /etc/ssh/sshd_not_to_be_run; remove before enabling units.
# Strip live-only LightDM autologin drop-in; keep 98-hyprcore-autologin.conf (Hyprland autologin).
# Enable SSH remote login for the Calamares-created user (password from users module).
dontChroot: false
timeout: 60

script:
  - command: "rm -f /etc/lightdm/lightdm.conf.d/50-hyprcore-live-autologin.conf"
  - command: "rm -f /etc/lightdm/lightdm.conf.d/88-hyprcore-openbox-session.conf /etc/lightdm/lightdm.conf.d/88-hyprcore-hyprland-session.conf /etc/lightdm/lightdm.conf.d/99-hyprcore-steam-session.conf /etc/lightdm/lightdm.conf.d/90-hyprcore-openbox-first-session.conf /etc/lightdm/lightdm.conf.d/97-hyprcore-autologin-steam.conf /etc/lightdm/lightdm.conf.d/99-hyprcore-autologin-steam.conf"
  - command: "chmod 0755 /usr/local/bin/hyprcore-session-action /usr/local/bin/hypr-settings /usr/local/bin/hyprcore-change-background /usr/local/bin/hyprcore-desktop-rmb /usr/local/bin/hyprcore-datetime /usr/local/bin/hyprcore-calendar /usr/local/bin/hyprcore-settings /usr/local/bin/hyprcore-btop /usr/local/bin/hyprcore-waybar-click /usr/local/bin/hyprcore-cava /usr/local/bin/hyprcore-power-settings /usr/local/bin/hyprcore-ensure-power-manager /usr/local/bin/hyprcore-ensure-hyprspace /usr/local/bin/hyprcore-fix-hyprspace-now /usr/local/bin/hyprcore-overview-defaults /usr/local/bin/hyprcore-overview-toggle /usr/local/bin/hyprcore-ensure-hyprbars /usr/local/bin/hyprcore-window-switch /usr/local/bin/hyprcore-escape /usr/local/bin/hyprcore-screenshot /usr/share/hyprcore/hyprcore-hyprland-session.sh /usr/share/hyprcore/hyprcore-hyprland-session-start.sh 2>/dev/null || true"
  - command: "chmod 0644 /usr/share/hyprcore/hyprcore_choice_dialog.py /usr/share/hyprcore/hyprcore_quick_settings.py /usr/share/hyprcore/cava/config /usr/share/hyprcore/hyprcore-hyprland-session-env.sh /usr/share/hyprcore/hyprcore-wallpaper-hyprpaper.sh /usr/share/hyprcore/hyprcore-session-log.sh /usr/share/wayland-sessions/hyprcore-hyprland.desktop /usr/share/applications/hyprcore-files.desktop /usr/share/applications/hyprcore-logout.desktop /usr/share/applications/hyprcore-restart.desktop /usr/share/applications/hyprcore-reboot.desktop /usr/share/applications/hyprcore-shutdown.desktop /etc/lightdm/lightdm.conf.d/10-hyprcore-lightdm-debug.conf 2>/dev/null || true"
  - command: "/usr/local/sbin/hyprcore-add-user-input-group.sh"
  - command: "/usr/local/sbin/hyprcore-install-crontab.sh"
  - command: "/usr/local/sbin/hyprcore-link-system-configs.sh"
  - command: "/usr/local/sbin/hyprcore-enable-flathub.sh"
  - command: "/usr/local/sbin/hyprcore-enable-ssh"
